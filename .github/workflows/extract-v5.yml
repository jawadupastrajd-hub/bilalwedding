name: Extract v5 zip flat to root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          rm -rf /tmp/v5extract
          mkdir -p /tmp/v5extract
          python3 -c "import zipfile; zipfile.ZipFile('bilal-fatima-dark.zip').extractall('/tmp/v5extract')"
          COUNT=$(ls -1 /tmp/v5extract | wc -l)
          TOP=$(ls -1 /tmp/v5extract | head -n 1)
          if [ "$COUNT" = "1" ] && [ -d "/tmp/v5extract/$TOP" ]; then
            SRC="/tmp/v5extract/$TOP"
          else
            SRC="/tmp/v5extract"
          fi
          echo "Copying contents of $SRC to repo root"
          cp -a "$SRC/." ./
          rm -f bilal-fatima-dark.zip
          rm -f .github/workflows/extract-v5.yml
          ls -la
      - name: Commit v5 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Timeline: time under date badge, description separate below, remove punctuality line"
            git push
          fi
