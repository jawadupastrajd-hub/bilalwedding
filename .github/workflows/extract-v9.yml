name: Extract v9 zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          ls -l bilal-fatima-dark.zip
          rm -rf /tmp/v9
          mkdir -p /tmp/v9
          unzip -o bilal-fatima-dark.zip -d /tmp/v9
          echo "--- top level ---"
          ls -la /tmp/v9
          COUNT=$(ls -1 /tmp/v9 | wc -l)
          FIRST=$(ls -1 /tmp/v9 | head -n 1)
          if [ "$COUNT" = "1" ] && [ -d "/tmp/v9/$FIRST" ]; then
            SRC="/tmp/v9/$FIRST"
          else
            SRC="/tmp/v9"
          fi
          echo "Copying from $SRC"
          cp -a "$SRC"/. .
          rm -f bilal-fatima-dark.zip
          rm -rf .github/workflows/extract-v9.yml
          echo "--- repo root after extract ---"
          ls -la
          echo "--- Shalima occurrences ---"
          grep -rn "Shalima" src public || true
          echo "--- Walima occurrences (should be none) ---"
          grep -rn "Walima" src public || echo "No Walima found"
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Rename Walima to Shalima" || echo "Nothing to commit"
          git push
