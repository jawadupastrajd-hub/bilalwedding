name: Unzip v11
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          unzip -o bilal-fatima-dark.zip
          rm -f bilal-fatima-dark.zip
          rm -rf __MACOSX
          for d in */; do
            if [ -f "${d}package.json" ]; then
              echo "Flattening top-level folder: $d"
              shopt -s dotglob nullglob
              mv "${d}"* ./
              rmdir "$d" || true
            fi
          done
          ls -la
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Closing names on two lines" || echo "Nothing to commit"
          git push
