name: Flatten v15 zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v15 zip flat to repo root
        run: |
          set -e
          unzip -o bilal-fatima-dark.zip -d /tmp/v15extract
          SRC=/tmp/v15extract
          ENTRIES=$(ls -A "$SRC")
          COUNT=$(echo "$ENTRIES" | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "$SRC/$ENTRIES" ]; then SRC="$SRC/$ENTRIES"; fi
          echo "Extracting from: $SRC"
          ls -A "$SRC"
          cp -a "$SRC"/. .
          rm -f bilal-fatima-dark.zip
          rm -f .github/workflows/flatten-v15.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Scratch reveal text in Calibri font"
          git push
