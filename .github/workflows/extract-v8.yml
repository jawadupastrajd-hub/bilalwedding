name: Extract v8 zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip flat to repo root
        run: |
          set -e
          ls -l bilal-fatima-dark.zip
          rm -rf /tmp/v8
          mkdir -p /tmp/v8
          unzip -o bilal-fatima-dark.zip -d /tmp/v8
          echo "--- top level ---"
          ls -la /tmp/v8
          COUNT=$(ls -1 /tmp/v8 | wc -l)
          FIRST=$(ls -1 /tmp/v8 | head -n 1)
          if [ "$COUNT" = "1" ] && [ -d "/tmp/v8/$FIRST" ]; then
            SRC="/tmp/v8/$FIRST"
          else
            SRC="/tmp/v8"
          fi
          echo "Copying from $SRC"
          cp -a "$SRC"/. .
          rm -f bilal-fatima-dark.zip
          rm -rf .github/workflows/extract-v8.yml
          echo "--- repo root after extract ---"
          ls -la
          grep -n "c9a96e55" src/app/globals.css || true
          grep -n "Calibri" src/app/globals.css || true
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Center punctuality line, border event cards, Calibri time font" || echo "Nothing to commit"
          git push
